<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hollow Hall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: full-bleed dark room on canvas. Cards (title, chapters, endings) sit bottom-left over a live flashlight demo; HUD runs along the top edge; story lines surface as subtitles at the bottom.
   One committed look (soot, bone, candle ember, dried blood), so it stays single-theme on purpose. */
:root {
  --soot: #06070a;
  --bone: #dcd5c2;
  --ash: #9a9382;
  --blood: #a11d1d;
  --ember: #ff9b3d;
  --display: 'IM Fell English SC', 'Times New Roman', serif;
  --body: 'Special Elite', 'Courier New', monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--soot); color: var(--bone); font-family: var(--body); overflow: hidden; }
#stage { position: relative; height: 100%; overflow: hidden; background: var(--soot); touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
#stage > canvas, .fx { position: absolute; inset: 0; width: 100%; height: 100%; }
.fx { pointer-events: none; }
#grain { image-rendering: pixelated; opacity: .1; mix-blend-mode: screen; pointer-events: none; }
#vig {
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 50% 45%, transparent 38%, rgba(0,0,0,.55) 76%, rgba(0,0,0,.92) 100%);
}
#pulse { background: radial-gradient(ellipse at center, transparent 28%, rgba(160,20,20,.8) 100%); opacity: 0; }

#hud {
  position: absolute; top: 0; left: 0; right: 0; z-index: 3;
  display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px 14px;
  padding-top: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.hl, .hr { display: flex; align-items: flex-end; gap: 10px 20px; flex-wrap: wrap; min-width: 0; }
.hl small, .meter small { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--ash); text-shadow: 0 1px 6px #000; }
.wicks { display: flex; align-items: flex-end; gap: 10px; }
.wicks small { margin-right: 4px; }
.wicks i { position: relative; display: block; width: 8px; height: 16px; background: #5c5648; border-radius: 1px; }
.wicks i::after { content: ""; position: absolute; left: 50%; bottom: 100%; width: 8px; height: 13px; margin-left: -4px; opacity: 0;
  border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: radial-gradient(ellipse at 50% 70%, #fff3c4, var(--ember) 60%, transparent 100%);
  box-shadow: 0 0 14px 4px rgba(255,155,61,.55); }
.wicks i.lit { background: var(--bone); }
.wicks i.lit::after { opacity: 1; animation: flame 1.1s ease-in-out infinite alternate; }
@keyframes flame { from { transform: scale(1, .92) translateX(-.5px); } to { transform: scale(.9, 1.08) translateX(.5px); } }
.meter { display: flex; align-items: center; gap: 8px; }
.meter b { display: block; width: 84px; height: 8px; border: 1px solid rgba(154,147,130,.5); background: rgba(0,0,0,.4); }
.meter b span { display: block; height: 100%; width: 100%; background: var(--ember); }
.meter.low b span { background: var(--blood); animation: blink .5s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.hbtn { pointer-events: auto; font: inherit; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--ash);
  background: rgba(0,0,0,.35); border: 1px solid rgba(154,147,130,.4); padding: 7px 12px; cursor: pointer; }
.hbtn:hover { color: var(--bone); border-color: var(--bone); }
.hbtn[aria-pressed="false"] { color: #6c675b; }
.hbtn:focus-visible, #go:focus-visible, #go2:focus-visible, #back:focus-visible, .ch:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }

#sub {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; pointer-events: none; text-align: center;
  padding: 40px max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(0deg, rgba(0,0,0,.65), rgba(0,0,0,0));
  font-size: 16px; line-height: 1.5; color: var(--bone); text-shadow: 0 1px 8px #000;
  opacity: 0; transition: opacity .6s;
}
#sub.on { opacity: 1; }
#sub span { display: block; max-width: 62ch; margin: 0 auto; }

#screen {
  position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; overflow-y: auto;
  padding-block: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    linear-gradient(90deg, rgba(3,4,6,.92) 0%, rgba(3,4,6,.6) 48%, rgba(3,4,6,0) 88%),
    linear-gradient(0deg, rgba(3,4,6,.88), rgba(3,4,6,0) 60%);
  cursor: default;
}
.panel { margin-top: auto; max-width: 600px; min-width: 0; }
.panel.fade { animation: fadein .8s both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.tag { margin: 0 0 12px; font-size: 13px; letter-spacing: .26em; text-transform: uppercase; color: var(--blood); }
h1 { margin: 0 0 16px; font-family: var(--display); font-weight: 400; font-size: clamp(48px, min(13vw, 17vh), 168px); line-height: .9; letter-spacing: .01em;
  color: var(--bone); text-wrap: balance; text-shadow: 2px 0 rgba(161,29,29,.75), -2px 0 rgba(60,110,140,.4), 0 0 40px rgba(0,0,0,.8);
  animation: glitch 7s steps(1) infinite; }
@keyframes glitch {
  0%, 93%, 100% { transform: none; }
  94% { transform: translate(-4px, 1px) skewX(-4deg); }
  95% { transform: translate(5px, -1px); }
  96% { transform: translate(-2px, 0) skewX(3deg); }
  97% { transform: none; }
}
.panel p { margin: 0; }
#s-text { font-size: 17px; line-height: 1.5; color: #c4bdaa; max-width: 46ch; }
.chapters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 20px 0 0; }
.ch { font: inherit; text-align: left; display: grid; gap: 2px; min-width: 0; color: var(--bone); background: rgba(0,0,0,.35);
  border: 1px solid rgba(154,147,130,.4); padding: 10px 12px; cursor: pointer; transition: border-color .2s; }
.ch b { font-weight: 400; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--blood); }
.ch span { font-size: 15px; }
.ch small { font-size: 12px; color: var(--ash); }
.ch:hover:not(:disabled) { border-color: var(--bone); }
.ch:disabled { opacity: .38; cursor: not-allowed; }
.keys { display: grid; gap: 6px; margin: 18px 0 0; }
.keys div { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: baseline; }
.keys dt { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--ash); }
.keys dd { margin: 0; font-size: 14px; color: var(--bone); min-width: 0; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
#go, #go2, #back { font: inherit; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--bone); background: transparent;
  border: 1px solid var(--bone); padding: 13px 22px; cursor: pointer; transition: background .2s, border-color .2s; }
#go2, #back { border-color: rgba(154,147,130,.5); color: var(--ash); }
#go:hover { background: var(--blood); border-color: var(--blood); }
#go2:hover:not(:disabled), #back:hover { color: var(--bone); border-color: var(--bone); }
#go2:disabled { opacity: .4; cursor: not-allowed; }
.note { margin-top: 14px !important; font-size: 13px; color: var(--ash); max-width: 52ch; }
#jpanel h2 { margin: 0 0 14px; font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 1; }
#jpanel h3 { margin: 22px 0 8px; font-weight: 400; font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--blood); }
#jpanel ol { list-style: none; margin: 0; padding: 0; }
#jpanel li { margin: 0 0 12px; font-size: 15px; line-height: 1.5; color: #cfc8b4; }
#jpanel li.miss { color: #6c675b; font-style: italic; }
@media (prefers-reduced-motion: reduce) { h1 { animation: none; } .wicks i.lit::after { animation: none; } .panel.fade { animation: none; } .meter.low b span { animation: none; } }
@media (max-width: 520px) { .hl small { display: none; } .meter b { width: 64px; } }
</style>

<main id="stage">
  <canvas id="game"></canvas>
  <canvas id="grain" class="fx" width="128" height="128"></canvas>
  <div id="vig" class="fx"></div>
  <div id="pulse" class="fx"></div>

  <header id="hud" hidden>
    <div class="hl">
      <div class="wicks" id="wicks" role="img" aria-label="Candles lit"><small>Candles</small></div>
      <div class="meter" id="meter" role="img" aria-label="Torch battery"><small>Torch</small><b><span id="batfill"></span></b></div>
    </div>
    <div class="hr">
      <button class="hbtn" id="clue" type="button">Ledger</button>
      <button class="hbtn" id="torch" type="button" aria-pressed="true">Torch on</button>
      <button class="hbtn" id="mute" type="button">Sound on</button>
    </div>
  </header>

  <div id="sub" aria-live="polite"><span id="subtext"></span></div>

  <section id="screen" aria-live="polite">
    <div class="panel" id="panel">
      <p class="tag" id="s-tag"></p>
      <h1 id="s-title"></h1>
      <p id="s-text"></p>
      <div class="chapters" id="chapters"></div>
      <dl class="keys" id="s-keys">
        <div><dt>Move</dt><dd>WASD or arrow keys · left thumb</dd></div>
        <div><dt>Aim light</dt><dd>Mouse · right thumb</dd></div>
        <div><dt>Torch</dt><dd>F, Space or right-click · torch button</dd></div>
      </dl>
      <div class="btns"><button id="go" type="button"></button><button id="go2" type="button"></button></div>
      <p class="note" id="s-note"></p>
    </div>
    <div class="panel" id="jpanel" hidden>
      <h2>Elias's pages</h2>
      <div id="jlist"></div>
      <div class="btns"><button id="back" type="button">Back</button></div>
    </div>
  </section>
</main>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2, $ = s => document.querySelector(s);
const stage = $('#stage'), cv = $('#game'), ctx = cv.getContext('2d');
const grain = $('#grain'), gx = grain.getContext('2d');
const dk = document.createElement('canvas'), dx = dk.getContext('2d');
const fl = document.createElement('canvas'), fx = fl.getContext('2d');
const pulse = $('#pulse'), hud = $('#hud'), screen = $('#screen'), panel = $('#panel'), jpanel = $('#jpanel');
const subEl = $('#sub'), subText = $('#subtext');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- story and level data ---------- */
const NOTES = [
  'Elias, day 1. The agent would not come past the gate. He said the hall keeps what it is given. I laughed. I should not have.',
  'Day 3. It only moves when I stop looking. I ringed the bedroom with candles and it stopped at the edge. Light holds it.',
  'Day 4. My torch dies faster here than it should. The hall feeds on the dark, and on batteries, and on me. Wren kept a ledger: She was walked in from the door one step at a time. Nearest the door first, farthest last. Out of order, every flame dies.',
  'Day 6. The ledger says a man named Wren sealed his wife in the cellar and lit candles to keep her quiet. The candles failed. She did not.',
  'Day 7. She is not hunting me. She is looking for him. She checks every face she finds, then moves on. I think I look like him. Ledger: Wren read to her every night, a page at a time. Light them as a page is read: top first, bottom last.',
  'Day 8. The cellar stairs open only for someone carrying fire. I am going down. Nira, if you read this, do not carry me out.',
  'Day 9. I found her. She is not angry. She is tired. The candles were never meant to keep her out. They keep her in.',
  'Day 10. Light does not hurt her. It holds her still, and being held is what is killing her. Put the flames out and she can rest. Ledger: The clock turns one way. Begin at the top and follow the hands.',
  'Day 10, night. If you do it, put them out one at a time, and do not look away. Do not look away, Nira. E.'
];
const LEVELS = [
  { name: 'The Hall', roman: 'I', theme: 'wood',
    rects: [['sofa', .10, .17, .21, .10], ['shelf', .56, .03, .30, .07], ['table', .38, .40, .14, .16], ['wardrobe', .82, .45, .08, .22], ['bed', .08, .62, .18, .20], ['piano', .58, .72, .20, .12]],
    candles: [[.06, .52], [.36, .92], [.92, .14], [.50, .60], [.92, .94]],
    cells: [[.45, .30], [.20, .40], [.70, .35], [.68, .62], [.70, .93]],
    notes: [[0, .62, .20], [1, .07, .40], [2, .45, .95]],
    door: { side: 'right', f: .30 }, start: [.30, .45],
    foes: [{ x: .88, y: .80, delay: 0, spd: 1 }],
    attract: { p: [.62, .58], f: [.34, .40] },
    clue: 2, key: (x, y) => Math.hypot(1 - x, .3 - y), rule: 'Nearest the door first, farthest last. Out of order, every flame dies.', hint: 'Start with the candle closest to the door, then work outward.',
    open: 'The front door locked behind you. Elias left pages in the dark. Find the page that glows red. It says how the candles must be lit.',
    intro: '' },
  { name: 'The Library', roman: 'II', theme: 'library',
    rects: [['shelf', .06, .03, .26, .07], ['shelf', .40, .03, .26, .07], ['shelf', .70, .03, .24, .07], ['shelf', .02, .22, .06, .30], ['shelf', .92, .30, .06, .30],
      ['table', .34, .34, .18, .13], ['table', .58, .50, .18, .13], ['sofa', .14, .60, .14, .10], ['sofa', .62, .80, .16, .09], ['shelf', .30, .88, .24, .07]],
    candles: [[.50, .20], [.14, .42], [.46, .72], [.86, .78]],
    cells: [[.30, .20], [.75, .20], [.25, .78], [.80, .42], [.40, .58]],
    notes: [[3, .20, .15], [4, .66, .68], [5, .08, .90]],
    door: { side: 'left', f: .80 }, start: [.88, .20],
    foes: [{ x: .10, y: .90, delay: 0, spd: 1.03 }],
    attract: { p: [.60, .30], f: [.22, .50] },
    clue: 4, key: (x, y) => y, rule: 'Light them as a page is read: top first, bottom last.', hint: 'Start with the highest candle on the screen and move down.',
    open: 'A reading room. The candles are in the stacks, and so is the way down. Look for the red glow.',
    intro: 'The door opens onto a long reading room. Books lie open everywhere, as if someone read in a hurry.' },
  { name: 'The Cellar', roman: 'III', theme: 'stone',
    rects: [['pillar', .22, .18, .06, .10], ['pillar', .72, .18, .06, .10], ['pillar', .22, .66, .06, .10], ['pillar', .72, .66, .06, .10], ['altar', .43, .40, .14, .16],
      ['crate', .06, .12, .09, .12], ['crate', .84, .80, .10, .12], ['crate', .40, .84, .10, .09], ['crate', .86, .14, .07, .10], ['crate', .06, .78, .08, .10]],
    candles: [[.50, .30], [.36, .48], [.64, .48], [.50, .70]],
    cells: [[.12, .50], [.88, .50], [.30, .12], [.70, .12], [.30, .90], [.72, .90]],
    notes: [[6, .08, .35], [7, .92, .62], [8, .62, .84]],
    door: { side: 'top', f: .50 }, start: [.22, .88],
    foes: [{ x: .85, y: .30, delay: 0, spd: 1.05 }],
    attract: { p: [.65, .52], f: [.30, .30] },
    clue: 7, key: (x, y) => (Math.atan2(y - .48, x - .5) + Math.PI / 2 + TAU) % TAU, rule: 'Begin at the top and follow the hands of a clock around the altar.', hint: 'Start with the candle above the altar, then go clockwise.',
    open: 'Four candles, one altar. Do not look away. Look for the red glow.',
    intro: 'The stairs go down further than the house is tall. Four candles stand around a stone altar. Something old is down here with you.' }
];

/* ---------- saved progress (per browser, optional) ---------- */
const KEY = 'hollow-hall-v2';
const save = { notes: [], bests: [], reached: 0, endings: [] };
try {
  const s = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (s && typeof s === 'object') {
    if (Array.isArray(s.notes)) save.notes = s.notes.filter(n => Number.isInteger(n) && n >= 0 && n < NOTES.length);
    if (Array.isArray(s.bests)) save.bests = s.bests.slice(0, 3);
    if (Number.isInteger(s.reached)) save.reached = Math.max(0, Math.min(2, s.reached));
    if (Array.isArray(s.endings)) save.endings = s.endings.filter(e => e === 'A' || e === 'B');
  }
} catch (e) {}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------- state ---------- */
let W = 800, H = 600, S = 1, DPR = 1, state = 'title';
const keys = {}, aim = { x: 0, y: 0, touch: false };
let stick = null, aimId = null;
const P = { x: 0, y: 0, r: 10, a: Math.PI };
const CR = () => 20 * S;
let level = 0, cfg = LEVELS[0];
let rects = [], candles = [], bats = [], items = [], foes = [], motes = [], door = { x: 0, y: 0, w: 0, h: 0, cx: 0, cy: 0 }, WALL = 14;
let t = 0, lightI = .95, flick = { cut: 0, next: 4 }, shake = 0, flash = 0, deadT = 0, rt = 0, dawn = 0;
let elapsed = 0, litN = 0, danger = 0, hb = 1, endShown = false, grainT = 0, subT = 0;
let order = [], orderTxt = '', clueKnown = false, fails = 0;
let torch = true, bat = 100, doorOpen = false, beam = true, screenKind = 'title', prevKind = 'title', lastClear = null;
const CONE = .36;
const baseRange = () => 400 * S;
const curRange = () => baseRange() * (.5 + .5 * Math.min(1, bat / 30));

function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; }
function rr(x, y, w, h, r) { fx.beginPath(); fx.roundRect(x, y, w, h, r); }

/* ---------- layout ---------- */
function layout() {
  cfg = LEVELS[level];
  S = Math.max(.55, Math.min(1.35, Math.min(W, H) / 700));
  WALL = 14 * S;
  const wc = candles.map(c => c.lit), wb = bats.map(b => b.got), wn = items.map(n => n.got);
  rects = cfg.rects.map(([k, a, b, c, d]) => ({ k, x: W * a, y: H * b, w: W * c, h: H * d }));
  candles = cfg.candles.map(([a, b], i) => ({ x: W * a, y: H * b, lit: !!wc[i], ph: i * 1.7, prog: 0 }));
  bats = cfg.cells.map(([a, b], i) => ({ x: W * a, y: H * b, got: !!wb[i], ph: i * 2.1 }));
  items = cfg.notes.map(([id, a, b], i) => ({ id, x: W * a, y: H * b, got: !!wn[i], ph: i * 1.3 }));
  const L = 74 * S, d = cfg.door;
  if (d.side === 'right') door = { x: W - WALL, y: H * d.f - L / 2, w: WALL, h: L, cx: W - WALL / 2, cy: H * d.f };
  else if (d.side === 'left') door = { x: 0, y: H * d.f - L / 2, w: WALL, h: L, cx: WALL / 2, cy: H * d.f };
  else door = { x: W * d.f - L / 2, y: 0, w: L, h: WALL, cx: W * d.f, cy: WALL / 2 };
  motes = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, v: 6 + Math.random() * 10, s: .6 + Math.random() * 1.2, p: Math.random() * TAU }));
  buildFloor();
}

function buildFloor() {
  fl.width = W * DPR; fl.height = H * DPR;
  fx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const R = rng(7 + level * 13), th = cfg.theme;
  fx.fillStyle = '#17110d'; fx.fillRect(0, 0, W, H);
  if (th === 'stone') {
    const ts = Math.max(52, 70 * S);
    for (let y = 0; y < H; y += ts) for (let x = 0; x < W; x += ts) {
      const g = 26 + (R() * 16 | 0);
      fx.fillStyle = `rgb(${g},${g + 3},${g + 4})`; fx.fillRect(x + 1, y + 1, ts - 2, ts - 2);
      if (R() < .25) { fx.fillStyle = 'rgba(40,72,48,.28)'; fx.beginPath(); fx.arc(x + R() * ts, y + R() * ts, ts * (.15 + R() * .2), 0, TAU); fx.fill(); }
      if (R() < .15) { fx.strokeStyle = 'rgba(0,0,0,.45)'; fx.lineWidth = 1.5; fx.beginPath(); const sx = x + R() * ts, sy = y + R() * ts; fx.moveTo(sx, sy); fx.lineTo(sx + (R() - .5) * ts, sy + (R() - .5) * ts); fx.lineTo(sx + (R() - .5) * ts, sy + (R() - .5) * ts); fx.stroke(); }
    }
    const rx = W * .5, ry = H * .48, rad = Math.min(W, H) * .27;
    fx.strokeStyle = 'rgba(125,28,28,.6)'; fx.lineWidth = 3 * S; fx.beginPath(); fx.arc(rx, ry, rad, 0, TAU); fx.stroke();
    fx.lineWidth = 1.5 * S; fx.beginPath(); fx.arc(rx, ry, rad * .84, 0, TAU); fx.stroke();
    for (let i = 0; i < 16; i++) { const a = i / 16 * TAU; fx.beginPath(); fx.moveTo(rx + Math.cos(a) * rad * .84, ry + Math.sin(a) * rad * .84); fx.lineTo(rx + Math.cos(a) * rad, ry + Math.sin(a) * rad); fx.stroke(); }
  } else {
    const tint = th === 'library' ? [8, 5, -4] : [14, 6, -2], ph = Math.max(22, 26 * S);
    for (let y = 0; y < H; y += ph) {

/* ---------- update ---------- */
function update(dt) {
  t += dt;
  motes.forEach(m => { m.y -= m.v * dt * .4; m.x += Math.sin(t * .6 + m.p) * 6 * dt; if (m.y < 0) { m.y = H; m.x = Math.random() * W; } });

  flick.next -= dt;
  if (flick.cut > 0) { flick.cut -= dt; lightI = Math.random() * .14; }
  else {
    lightI = .93 + Math.random() * .05;
    if (flick.next <= 0 && state !== 'dead' && state !== 'release') {

  }
  if (state === 'play' && torch && bat > 0) {
    bat = Math.max(0, bat - dt * 1.8);

    if (bat <= 0) { torch = false; updateTorchUi(); showSub('The torch is dead. Find batteries.', 4); click(); }
  }
  beam = state !== 'dead' && torch && bat > 0 && flick.cut <= 0;
  foes.forEach(f => { f.lit = f.active && beam && inCone(f.x, f.y, CR()); });
  shake *= Math.pow(.02, dt); flash *= Math.pow(.05, dt);

  if (state === 'title') {
    P.a = Math.PI + Math.sin(t * .45) * .9;
  } else if (state === 'play') {
    elapsed += dt;
    foes.forEach((f, i) => {
      if (!f.active && elapsed >= f.delay) { f.active = true; stinger(); flash = .45; shake = .5; showSub('Something else has noticed the light.', 4); }
    });
    let mx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    let my = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
    if (stick) {
      const sx = stick.x - stick.ox, sy = stick.y - stick.oy, sd = Math.hypot(sx, sy);
      if (sd > 6) { const k = Math.min(sd, 56) / 56; mx += sx / sd * k; my += sy / sd * k; }
    }
    const m = Math.hypot(mx, my); if (m > 1) { mx /= m; my /= m; }

    if (aim.touch) { if (aimId !== null) target = Math.atan2(aim.y - P.y, aim.x - P.x); else if (m > .15) target = Math.atan2(my, mx); }

    const cr = CR();

      const dxp = P.x - f.x, dyp = P.y - f.y, d = Math.hypot(dxp, dyp) || 1;
      f.move = false;

    for (const n of items) if (!n.got && Math.hypot(P.x - n.x, P.y - n.y) < 20 * S) foundNote(n);

  } else if (state === 'release') {
    rt += dt; danger *= Math.pow(.1, dt);

    wind.gain.value = .03 + .02 * Math.sin(t * .3);

}

function render() {

  ctx.fillStyle = '#060000'; ctx.fillRect(0, 0, W, H);
  const k = Math.min(1, deadT / .18), m = Math.min(W, H);
  const s = m * (.12 + .26 * k) * (1 + Math.sin(deadT * 60) * .03);
  const jx = (Math.random() - .5) * 16 * (reduce ? .2 : 1), jy = (Math.random() - .5) * 16 * (reduce ? .2 : 1);
  ctx.globalCompositeOperation = 'lighter'; glow(W / 2, H / 2, m * .9, '190,20,20', .55 * Math.min(1, 1.6 - deadT));
  ctx.globalCompositeOperation = 'source-over';
  drawCreature(W / 2 + jx, H / 2 + jy - s * .1, s, t, true, .5 + .5 * Math.sin(deadT * 40), true);
  if (deadT > .9) { ctx.fillStyle = `rgba(0,0,0,${Math.min(1, (deadT - .9) / .8)})`; ctx.fillRect(0, 0, W, H); }
  pulse.style.opacity = Math.max(0, Math.min(1, 1.1 - deadT)).toFixed(3);
}

/* ---------- input ---------- */
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (state === 'play' && (e.code === 'KeyF' || e.code === 'Space')) { if (!e.repeat) toggleTorch(); e.preventDefault(); }
  else if (state === 'play' && /^Arrow/.test(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; stick = null; aimId = null; });
const pt = e => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
stage.addEventListener('pointerdown', e => {
  const p = pt(e);
  if (e.pointerType === 'touch') {
    aim.touch = true;
    if (p.x < W * .5 && !stick) stick = { id: e.pointerId, ox: p.x, oy: p.y, x: p.x, y: p.y };
    else if (aimId === null) { aimId = e.pointerId; aim.x = p.x; aim.y = p.y; }
  } else { aim.touch = false; aim.x = p.x; aim.y = p.y; }
});
stage.addEventListener('pointermove', e => {
  const p = pt(e);
  if (e.pointerType !== 'touch') { aim.touch = false; aim.x = p.x; aim.y = p.y; return; }
  if (stick && e.pointerId === stick.id) { stick.x = p.x; stick.y = p.y; }
  else if (e.pointerId === aimId) { aim.x = p.x; aim.y = p.y; }
});
const up = e => { if (stick && e.pointerId === stick.id) stick = null; if (e.pointerId === aimId) aimId = null; };
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
stage.addEventListener('contextmenu', e => { e.preventDefault(); toggleTorch(); });
[hud, screen].forEach(el => el.addEventListener('pointerdown', e => e.stopPropagation()));
$('#go').addEventListener('click', onGo);
$('#go2').addEventListener('click', onGo2);
$('#back').addEventListener('click', () => { panel.hidden = false; jpanel.hidden = true; screenKind = prevKind; $('#go').focus({ preventScroll: true }); });
$('#clue').addEventListener('click', e => { if (state === 'play') showSub(clueKnown ? 'Ledger: ' + cfg.rule + ' LIGHT IN THIS ORDER: ' + orderTxt : 'You have not found the ledger page yet. It has a red wax seal and glows red. Search the room.', 7); e.currentTarget.blur(); });
$('#torch').addEventListener('click', e => { toggleTorch(); e.currentTarget.blur(); });
$('#mute').addEventListener('click', e => {
  muted = !muted; e.currentTarget.textContent = muted ? 'Sound off' : 'Sound on'; e.currentTarget.blur();
  if (master) master.gain.setTargetAtTime(muted ? 0 : .85, AC.currentTime, .05);
});

/* ---------- boot ---------- */
function resize() {
  const r = stage.getBoundingClientRect(); if (!r.width || !r.height) return;
  const ox = W, oy = H;
  W = Math.round(r.width); H = Math.round(r.height); DPR = Math.min(window.devicePixelRatio || 1, 2);
  [cv, dk].forEach(c => { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); });
  if (ox && oy) { P.x *= W / ox; P.y *= H / oy; foes.forEach(f => { f.x *= W / ox; f.y *= H / oy; }); }
  layout();
  if (!aim.x && !aim.y) { aim.x = W / 2; aim.y = H / 2; }
}
const gi = gx.createImageData(128, 128);
function noise() {
  const d = gi.data;
  for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255 | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  gx.putImageData(gi, 0, 0);
}
new ResizeObserver(resize).observe(stage);
resize(); setLevel(0); showScreen('title'); noise();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render();
  grainT += dt; if (grainT > .09) { grainT = 0; if (!reduce) noise(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
